# Dependabot keeps dependencies and CI actions current. Two ecosystems:
#   - npm:           src/package.json (production + dev deps)
#   - github-actions: pinned action versions in .github/workflows/*.yml
#
# Weekly cadence is enough for a low-traffic project; bump to daily if security
# alerts feel slow to surface. PRs are grouped to keep the queue reviewable.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Bundle minor + patch bumps so we don't get N PRs per week. Major
      # bumps stay separate because they typically need manual review
      # (Next/React/D3 majors all carry breaking changes).
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      # size-limit and @size-limit/file pin each other with an EXACT peer
      # dependency (@size-limit/file@13.0.3 requires size-limit@13.0.3), so a PR
      # bumping one without the other fails `npm ci` with ERESOLVE. That is what
      # sank #54 and #57. Grouping them means one PR carries both.
      size-limit:
        patterns:
          - "size-limit"
          - "@size-limit/*"
    ignore:
      # @sparticuz/chromium must track the Chromium version in puppeteer-core.
      # Auto-bumping it independently can break PDF export on Vercel; bump
      # this and puppeteer-core together by hand.
      - dependency-name: "@sparticuz/chromium"

      # ESLint majors are blocked upstream, not by us. `eslint-config-next`
      # depends on `eslint-plugin-react: ^7.37.0`, and 7.37.5 (the latest)
      # still declares `peerDependencies.eslint: "... || ^9.7"`. On ESLint 10
      # `npm run lint` dies before linting anything:
      #   TypeError: contextOrFilename.getFilename is not a function
      #     while loading rule 'react/display-name'
      # Drop this entry once eslint-plugin-react ships ESLint 10 support (and
      # eslint-config-next picks it up); minor/patch bumps within 9.x still
      # flow through the minor-and-patch group.
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"

      # TypeScript majors are blocked the same way ESLint majors are, one layer
      # down: `eslint-config-next` bundles typescript-eslint, which refuses to
      # load on TS 7 —
      #   Error: typescript-eslint does not support TS 7.0
      # so `npm run lint` dies before linting anything (that was #55). Drop this
      # once typescript-eslint supports TS 7 and eslint-config-next picks it up;
      # 6.x minor/patch bumps still flow through the minor-and-patch group.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Every action here is pinned to a floating major tag (`@v7`, `@v4`, ...),
      # so patch and minor releases are picked up automatically on the next run
      # — a PR for them changes nothing but the diff. Worse, Dependabot reads
      # `@v4` as "version 4" and proposes `@v4.37.4`, which would *downgrade*
      # us from a self-updating tag to a hard pin and generate a PR per patch
      # release forever (that was #48). Majors are what need human review, and
      # those still come through.
      #
      # If we ever switch to full commit-SHA pinning for supply-chain
      # hardening, delete this block — SHA pins need every update proposed.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
