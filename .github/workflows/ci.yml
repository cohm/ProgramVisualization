name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # Also run by release.yml before it deploys, so a release cannot deploy a
  # build that fails here today (the audit gate reads a live advisory feed).
  # Called this way the job reports as "ci / build-and-quality"; PR runs keep
  # the plain "build-and-quality" the main ruleset requires.
  workflow_call:

# Cancel superseded runs on the same ref (e.g. when a PR is force-pushed).
# `main` keeps in-progress runs because we usually want every commit on main
# to produce a final result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build-and-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Node 24 (Krypton) is the current active LTS, EOL 2028-04-30.
          # Node 20 went EOL 2026-04-30 and is below the floor declared by
          # puppeteer-core and size-limit (engines.node >= 22.12.0), which is
          # what the EBADENGINE warnings on every `npm ci` were about.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        # Fails on HIGH or CRITICAL advisories in installed packages, except
        # those accepted, with a reason and a review date, in
        # scripts/audit-allowlist.json. The escape hatches, in order of
        # preference, are listed at the top of scripts/audit-check.mjs; an
        # allowlist entry is for an advisory with no patched version that does
        # not reach what ships. Avoid `|| true`; that hides everything.
        run: npm run audit-check

      - name: Validate program data files
        run: npm run validate-data

      - name: Run lint checks
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build project
        run: npm run build

      - name: Check bundle size
        # Two budgets, in `package.json` -> `size-limit`. Bump a limit
        # deliberately when an increase is justified; the diff documents why.
        #
        # scripts/split-size-chunks.mjs first sorts the chunks, since their
        # names are content hashes: a chunk is data only if it is a single
        # JSON module whose value equals a file in src/data.
        #   app   ~202 kB  the application code, every chunk that is not data
        #   data  ~290 kB  one lazily loaded chunk per src/data JSON file, the
        #                  cohort archive above all (2-7 kB brotlied per
        #                  cohort file). A viewer downloads only what they
        #                  open, so this grows with every programme added
        #                  without the app getting any heavier.
        # When the data budget fails, check `du -sh src/data/cohorts` first.
        run: npm run size
